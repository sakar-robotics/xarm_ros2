# The uf850 hardware interface runs the arm in XARM_MODE::POSE and commands it with
# set_position(), so it exports Cartesian gpio command interfaces instead of per joint
# ones. joint_trajectory_controller therefore cannot be used here.
#
# Note on prefix: add_prefix_to_ros2_control_params() rewrites controller names and
# `joints` lists but not `sensor_name`, `frame_id` or `gpios`. Running with a non-empty
# prefix requires those three to be prefixed by hand.
controller_manager:
  ros__parameters:
    update_rate: 15 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    uf_ft_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    tcp_pose_controller:
      type: gpio_controllers/GpioCommandController

# Publishes geometry_msgs/WrenchStamped on ~/wrench from the ft_sensor state interfaces.
uf_ft_sensor_broadcaster:
  ros__parameters:
    sensor_name: ft_sensor
    frame_id: link_eef

# Accepts control_msgs/DynamicInterfaceGroupValues on ~/commands (x y z in m, roll pitch
# yaw in rad) and publishes the measured pose on ~/gpio_states.
#
# Keep the interface names quoted. YAML 1.1, which rcl's parser follows, reads a bare y
# as the boolean true; that makes the sequence mixed-type and rcl rejects the entire
# params file with "Sequence should be of same type".
tcp_pose_controller:
  ros__parameters:
    gpios:
      - tcp
    command_interfaces:
      tcp:
        interfaces:
          - "x"
          - "y"
          - "z"
          - "roll"
          - "pitch"
          - "yaw"
    state_interfaces:
      tcp:
        interfaces:
          - "x"
          - "y"
          - "z"
          - "roll"
          - "pitch"
          - "yaw"
